repos:
  # Keep Copier update conflicts out of commits, including conflicts produced
  # outside an active Git merge operation.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
        args:
          - --assume-in-merge
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: component-tables
        name: Generate component tables
        entry: poetry run python scripts/update_component_tables.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: ruff-check
        name: Ruff lint
        entry: poetry run ruff check
        language: system
        types_or:
          - python
          - pyi
      - id: ruff-format
        name: Ruff format
        entry: poetry run ruff format --check
        language: system
        types_or:
          - python
          - pyi
      - id: mypy
        name: Mypy
        entry: poetry run mypy src
        language: system
        pass_filenames: false
