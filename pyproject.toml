[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interop-trace"
version = "0.1.0"
description = "Tracing interoperability across bioinformatics databases and workflows."
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
authors = [
  { name = "Mariia Steeghs-Turchina", email = "m.a.steeghs-turchina@lumc.nl" },
]
dependencies = ["typer", "pooch (>=1.9,<2)"]
keywords = ["interoperability", "workflow", "benchmarking"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest"]
quality = ["pre-commit", "ruff", "mypy"]
docs = ["zensical", "mkdocstrings[python]"]
proteobench = ["proteobench (==0.18.6)"]

[project.scripts]
"interop-trace" = "interop_trace.cli:main"

[project.urls]
"Source Code" = "https://github.com/thatmariia/interop_trace"
Documentation = "https://thatmariia.github.io/interop_trace/"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["typer.*", "pooch.*", "proteobench.*"]
ignore_missing_imports = true
